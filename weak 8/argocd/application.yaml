apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parallax-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: parallax
spec:
  project: default
  source:
    repoURL: https://github.com/salehkhattak/devops-internship.git
    targetRevision: main
    path: weak 6/parallax-app
    helm:
      releaseName: parallax-release
  destination:
    server: https://kubernetes.default.svc
    namespace: parallax
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true