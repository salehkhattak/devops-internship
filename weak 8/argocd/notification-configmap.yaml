apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.slack: |
    url: $slack-webhook-url
    headers:
      - name: Content-Type
        value: application/json
  template.app-sync-failed: |
    webhook:
      slack:
        method: POST
        body: |
          {"text":"ArgoCD sync failed: {{.app.metadata.name}}\nRevision: {{.app.status.sync.revision}}\nMessage: {{.app.status.operationState.message}}"}
  trigger.on-sync-failed: |
    - description: Application sync failed
      when: app.status.operationState.phase in ['Error', 'Failed']
      send:
        - app-sync-failed