apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: parallax 

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

      - name: frontend

        image: salehktk005/simple-node-app:v1

        imagePullPolicy: IfNotPresent

        ports:

        - containerPort: 3000

        env:
        - name: PORT
          value: "3000"
        - name: SERVICE_NAME
          value: "frontend"
        envFrom:
        - configMapRef:
            name: app-config

        resources:

          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:

          httpGet:
            path: /health
            port: 3000

          initialDelaySeconds: 10

        readinessProbe:

          httpGet:
            path: /health
            port: 3000

          initialDelaySeconds: 5