apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "parallax-app.frontend.fullname" . }}-test-connection"
  labels:
    {{- include "parallax-app.frontend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "parallax-app.frontend.fullname" . }}:{{ .Values.frontend.service.port }}/health']
  restartPolicy: Never
