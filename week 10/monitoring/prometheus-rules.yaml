# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parallax-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: parallax.service-health
      rules:
        - alert: ParallaxHighLatency
          expr: histogram_quantile(0.95, sum by (le, destination_service_name) (rate(istio_request_duration_milliseconds_bucket{destination_service_namespace="parallax"}[5m]))) > 1000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High p95 latency for a Parallax service
            description: "The p95 request latency for {{ $labels.destination_service_name }} has exceeded 1 second for 5 minutes."
        - alert: ParallaxHighErrorRate
          expr: (sum(rate(istio_requests_total{destination_service_namespace="parallax",response_code=~"5.."}[5m])) / sum(rate(istio_requests_total{destination_service_namespace="parallax"}[5m]))) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: High 5xx error rate in Parallax
            description: "More than 5% of Parallax service-mesh requests have returned 5xx responses for 2 minutes."
        - alert: ParallaxPodCrashLooping
          expr: kube_pod_container_status_waiting_reason{namespace="parallax",reason="CrashLoopBackOff"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: A Parallax container is crash looping
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has been in CrashLoopBackOff for 2 minutes."