apiVersion: v1
kind: Namespace
metadata:
  name: legacy
  labels:
    istio-injection: disabled
---
apiVersion: v1
kind: Pod
metadata:
  name: curler-uninjected
  namespace: legacy
spec:
  containers:
    - name: curler
      image: curlimages/curl:latest
      command: ["/bin/sh", "-c", "sleep 3600"]
