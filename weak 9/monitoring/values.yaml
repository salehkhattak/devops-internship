grafana:
  enabled: true
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
prometheus:
  enabled: true
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 7d
alertmanager:
  enabled: true
prometheusOperator:
  enabled: true
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true