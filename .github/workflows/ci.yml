name: CI – Lint, Test & Build Docker Image

# ─────────────────────────────────────────────────
# Trigger conditions
# ─────────────────────────────────────────────────
on:
  push:
    branches:
      - "**"           # Run on every branch push
  pull_request:
    branches:
      - main           # Run on PRs targeting main

# ─────────────────────────────────────────────────
# Shared env
# ─────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/parallax-microservice

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1 – Lint & Unit Tests
  # ─────────────────────────────────────────────────
  lint-and-test:
    name: 🔍 Lint & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: weak 7/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "weak 7/app/package.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint (syntax check)
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  # ─────────────────────────────────────────────────
  # JOB 2 – Build & Push Docker Image
  # Only runs on pushes to main branch
  # ─────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test          # Only runs if lint-and-test passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write             # Required for GHCR push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Derive image tags ──────────────────────
      - name: Extract Git metadata for tagging
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Git commit SHA (short) – primary immutable tag
            type=sha,prefix=sha-,format=short
            # Semantic version tag if a Git tag exists (e.g. v1.2.3)
            type=semver,pattern={{version}}
            # Branch name tag (latest on main)
            type=raw,value=latest,enable={{is_default_branch}}

      # ── QEMU + Buildx for multi-platform builds ─
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GHCR ───────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build and push ─────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: "weak 7/app"
          file: "weak 7/app/Dockerfile"
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Print image digest ─────────────────────
      - name: Print image digest
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Digest: ${{ steps.build.outputs.digest }}"
          echo "🏷️  Tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

  # ─────────────────────────────────────────────────
  # JOB 3 – CI Summary (runs on every push)
  # ─────────────────────────────────────────────────
  ci-summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: always()

    steps:
      - name: Report lint & test status
        run: |
          echo "## 🚀 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step             | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Tests     | ${{ needs.lint-and-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
