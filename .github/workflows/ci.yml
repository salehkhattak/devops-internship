name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: weak 7/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: weak 7/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate GitOps image updater
        run: node --check "../../weak12/scripts/update-gitops-image.mjs"

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: lint-and-test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${owner_lc}/parallax-microservice" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.repository }}:${GITHUB_SHA}" \
            "weak 7/app"
          docker push "${{ steps.image.outputs.repository }}:${GITHUB_SHA}"

      - name: Update ArgoCD desired image
        run: |
          node "weak12/scripts/update-gitops-image.mjs" \
            "${{ steps.image.outputs.repository }}" \
            "${GITHUB_SHA}"

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "weak 6/parallax-app/values.yaml"
          if git diff --cached --quiet; then
            echo "The GitOps image reference is already current."
            exit 0
          fi
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main
